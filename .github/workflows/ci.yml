# 変更のたびに、組み立て・型の確認・テスト（仕様書の手計算の例題との一致を含む）と、
# 検算例の突き合わせ（手計算を回し直して expected.json が入力と組になっているかも見る）を流す
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node examples/run.mjs
      # 数は相対 1e-12 まで同じとみなす（対数や累乗は OS の数学ライブラリで最後の 1 桁が違うことがあり、
      # 文字どおりに比べると macOS で作った期待値が Linux で食い違う）。鍵・文字・並びは完全に同じであること
      - name: 手計算を回し直して、保存してある期待値と同じか
        run: |
          for d in examples/0*/; do
            cp "${d}expected.json" "${d}expected.saved.json"
            python3 "${d}handcalc.py" > /dev/null
            python3 examples/same_numbers.py "${d}expected.saved.json" "${d}expected.json"
          done
