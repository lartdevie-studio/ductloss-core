# 変更のたびに、組み立て・型の確認・テスト（仕様書の手計算の例題との一致を含む）と、
# 検算例の突き合わせ（手計算を回し直して expected.json が入力と組になっているかも見る）を流す
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node examples/run.mjs
      - name: 手計算を回し直して、保存してある期待値と同じか
        run: |
          python3 examples/01-single-fan/handcalc.py > /dev/null
          python3 examples/02-hex-aircon/handcalc.py > /dev/null
          python3 examples/03-roughness-bend-zeta/handcalc.py > /dev/null
          git diff --exit-code -- examples
